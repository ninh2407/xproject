services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: xproject
      POSTGRES_USER: xproject
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xproject -d xproject"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.1.0-alpine
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/xproject
      SPRING_DATASOURCE_USERNAME: xproject
      SPRING_DATASOURCE_PASSWORD: local-dev-only
      VALKEY_URL: redis://valkey:6379
      TL_JWT_KEY_ID: ${TL_JWT_KEY_ID:-}
      TL_JWT_PRIVATE_KEY: ${TL_JWT_PRIVATE_KEY:-}
      TL_JWT_PUBLIC_KEY: ${TL_JWT_PUBLIC_KEY:-}
      TL_AUTH_IDEMPOTENCY_HMAC_KEY: ${TL_AUTH_IDEMPOTENCY_HMAC_KEY:-}
      TL_CORS_ALLOWED_ORIGINS: ${TL_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,capacitor://localhost,https://localhost}
      TL_CAPTCHA_VERIFICATION_URI: ${TL_CAPTCHA_VERIFICATION_URI:-}
      TL_CAPTCHA_SECRET: ${TL_CAPTCHA_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8080:8080"

  game-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.game-server
    environment:
      PORT: 2567
      VALKEY_URL: redis://valkey:6379
      API_BASE_URL: http://api:8080
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "2567:2567"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  valkey-data:
