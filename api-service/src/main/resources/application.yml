server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xproject}
    username: ${SPRING_DATASOURCE_USERNAME:xproject}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only}
  data:
    redis:
      url: ${VALKEY_URL:redis://localhost:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: game
  jooq:
    sql-dialect: POSTGRES
  flyway:
    default-schema: api

security:
  jwt:
    key-id: ${TL_JWT_KEY_ID:}
    private-key: ${TL_JWT_PRIVATE_KEY:}
    public-key: ${TL_JWT_PUBLIC_KEY:}
  login:
    idempotency-hmac-key: ${TL_AUTH_IDEMPOTENCY_HMAC_KEY:}
  cors:
    allowed-origins: ${TL_CORS_ALLOWED_ORIGINS:}
  captcha:
    verification-uri: ${TL_CAPTCHA_VERIFICATION_URI:}
    secret: ${TL_CAPTCHA_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
